# Koadr on the VPS — lives at /opt/koadr on 91.98.89.225.
#
# The image is built by CI (.github/workflows/docker.yaml) and pushed to GHCR;
# never build on the VPS. Deploy:
#
#   docker compose -p koadr pull
#   docker compose -p koadr up -d
#
# Modelled on /opt/adapedu: the app publishes no host port, joins the shared
# `proxy` network so the edge Caddy can reach it by container name.

name: koadr

services:
  web:
    image: ${KOADR_IMAGE:-ghcr.io/iliasgnrs/koadr:latest}
    container_name: koadr-web
    restart: unless-stopped

    # Optional: provider keys can also come from the browser (the app's normal
    # flow). Marked optional so a fresh host can start before any key is added.
    env_file:
      - path: .env
        required: false

    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
      CLIENT_DIR: /app/build/client
      SERVER_BUILD: /app/build/server/index.js
      # Caddy is the only client and it overwrites X-Real-IP, so the header is
      # trustworthy here — this is what rate limiting and bug reports key on.
      BUG_REPORT_TRUSTED_IP_HEADER: x-real-ip

    # No `ports:` on purpose — only the reverse proxy may reach this container.
    networks:
      - internal
      - proxy

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    mem_limit: 2g
    cpus: 2

networks:
  internal:
    name: koadr_internal
  # Created once on the host:  docker network create proxy
  proxy:
    external: true
